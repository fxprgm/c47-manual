# Builds the User's Guide in every format (tools/build.py) and publishes it on the release
# "guide", whose download links never change:
#   https://github.com/fxprgm/c47-manual/releases/download/guide/C47-R47-Users-Guide.pdf
# On every push to main that touches the guide, and when run by hand. Pull requests and other
# branches get the files as a workflow artifact only.
name: guide

on:
  push:
    paths: ["guide/**", "shots/png/**", "tools/**", "fonts/**", "requirements.txt", "C47_VERSION",
            ".github/workflows/guide.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build every format
        run: |
          python tools/build.py
          (cd dist && zip -qr C47-R47-Users-Guide-site.zip site && zip -qr C47-R47-Users-Guide-chapters.zip chapters)

      - uses: actions/upload-artifact@v4
        with:
          name: users-guide
          path: |
            dist/*.pdf
            dist/*.html
            dist/*.epub
            dist/*.docx
            dist/*.zip

      - name: Publish on the release "guide"
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/guide"
          c47="$(sed -n 's/^c47=//p' C47_VERSION | cut -c1-10)"
          {
            echo "The C47/R47 User's Guide, **draft**: built from \`main\` at ${GITHUB_SHA::10} on $(date -u +%F),"
            echo "with the screens of C47 \`$c47\`. These links always give the newest build:"
            echo
            echo "- PDF: [C47-R47-Users-Guide.pdf]($base/C47-R47-Users-Guide.pdf), or [each chapter alone]($base/C47-R47-Users-Guide-chapters.zip)"
            echo "- One web page, works offline: [C47-R47-Users-Guide.html]($base/C47-R47-Users-Guide.html)"
            echo "- A small website, a page per section: [C47-R47-Users-Guide-site.zip]($base/C47-R47-Users-Guide-site.zip)"
            echo "- E-book: [C47-R47-Users-Guide.epub]($base/C47-R47-Users-Guide.epub)"
            echo "- Word processor: [C47-R47-Users-Guide.docx]($base/C47-R47-Users-Guide.docx)"
            echo
            echo "GNU Free Documentation License 1.3 or later. To build it yourself: README.md."
          } > notes.md
          files="dist/C47-R47-Users-Guide.pdf dist/C47-R47-Users-Guide.html dist/C47-R47-Users-Guide.epub dist/C47-R47-Users-Guide.docx dist/C47-R47-Users-Guide-site.zip dist/C47-R47-Users-Guide-chapters.zip"
          title="C47/R47 User's Guide (draft, $(date -u +%F))"
          if gh release view guide >/dev/null 2>&1; then
            gh release upload guide $files --clobber
            gh release edit guide --notes-file notes.md --title "$title"
          else
            gh release create guide $files --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "$title" --notes-file notes.md
          fi
